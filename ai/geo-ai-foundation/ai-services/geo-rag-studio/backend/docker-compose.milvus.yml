name: geo-rag-studio

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - geo-rag-etcd:/etcd
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    environment:
      AWS_ACCESS_KEY_ID: geo-rag-local
      AWS_SECRET_ACCESS_KEY: geo-rag-local-only
      S3_BUCKET: a-bucket
    volumes:
      - geo-rag-object-store:/data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: seaweedfs:8333
      MINIO_ACCESS_KEY_ID: geo-rag-local
      MINIO_SECRET_ACCESS_KEY: geo-rag-local-only
    volumes:
      - geo-rag-milvus:/var/lib/milvus
    ports:
      - "127.0.0.1:19531:19530"
      - "127.0.0.1:9092:9091"
    depends_on:
      - etcd
      - seaweedfs
    restart: unless-stopped

volumes:
  geo-rag-etcd:
  geo-rag-object-store:
  geo-rag-milvus:
