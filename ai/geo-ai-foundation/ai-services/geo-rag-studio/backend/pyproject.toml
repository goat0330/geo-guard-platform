[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-rag-studio"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "aiohttp>=3.14.1",
  "numpy>=1.26",
  "json-repair>=0.54.0",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "jieba>=0.42.1",
  "scikit-learn>=1.5",
  "markdown-it-py>=3.0.0",
  "mdit-py-plugins>=0.4.0",
  "beautifulsoup4>=4.12.0",
  "markdownify>=0.13.1",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.2",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.1",
  "pillow>=11",
  "loguru>=0.7.3",
  "tzdata>=2025.2",
  "pypdfium2>=5.0.0",
  "rapidocr>=3.0.0",
  "requests>=2.34.0",
  "networkx>=3.5",
  "minio>=7.2.7",
  "pymilvus>=2.5.8",
  "asyncpg>=0.30.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary,pool]>=3.3.3",
  "redis>=5.2.0",
  "sqlalchemy[asyncio]>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]
